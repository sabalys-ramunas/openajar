[project]
name = "openajar"
version = "0.5.4"
description = "Self-hosted cloud dev environments for AI coding agents: a disposable VM with a terminal and a real browser for Claude Code, Codex and any MCP client."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Ramunas Sabalys" }]
keywords = [
  "ai-agents", "coding-agents", "mcp", "model-context-protocol", "mcp-server", "claude-code",
  "codex", "dev-environment", "cloud-sandbox", "ephemeral-vm", "remote-browser",
  "browser-automation", "hetzner", "docker", "self-hosted",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: System :: Distributed Computing",
]

dependencies = [
  # mcp 2.x: mcp/registry.py imports mcp.server.mcpserver and InputRequiredResult
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "typer>=0.12",
  "uvicorn>=0.30",
  "tomli-w>=1.0",
  "cryptography>=50.0.2",
  "pyotp>=2.10.0",
  "publicsuffixlist>=1.1.2.20261101",
  "idna>=3.20",
  "h11>=0.16",  # the app secrets swap frames HTTP/1.1 itself (openajar.environments.swap)
  "httpx>=0.28.1",
  "starlette>=1.10.0",
  "croniter>=6.2.4",
  "jsonschema>=4.26.0",
  "websockets>=17.4",
  "textual>=8.2.8",
  "webauthn>=3.0.1",
  "pyyaml>=6.0",
  "dnspython>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/sabalys-ramunas/openajar"
Repository = "https://github.com/sabalys-ramunas/openajar"
Documentation = "https://github.com/sabalys-ramunas/openajar/blob/main/docs/ENVIRONMENTS.md"
Issues = "https://github.com/sabalys-ramunas/openajar/issues"
Changelog = "https://github.com/sabalys-ramunas/openajar/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The browser stack, only on nodes (`uv sync --extra node`); the hosted cloud imports
# openajar.core without it.
node = [
  "camoufox[geoip]>=0.5.9,<0.6",
  "playwright>=1.62,<1.63",
]
# openajar on a laptop (`openajar local`, scripts/install.sh installs `openajar[local]`): Playwright's client
# drives each environment's browser, which runs on the environment's VM (openajar.environments.vmbrowser).
# No Camoufox here, and no browser binary: nothing runs `playwright install` or `camoufox fetch`.
local = [
  "playwright>=1.62,<1.63",
  "Pillow>=11",  # the replay's frames are made smaller on the laptop too (openajar.environments.replay)
]
# Studio's review browser and image work, on a laptop or a node (`uv sync --extra studio`). The
# engines themselves come from `python -m playwright install chromium` or the installed Chrome.
studio = [
  "playwright>=1.62,<1.63",
  "Pillow>=11",
]

[dependency-groups]
dev = [
  "openajar[node]",
  "openajar[studio]",
  "openapi-spec-validator>=0.7",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
openajar = "openajar.cli:app"
# legacy-name: `agentos`, the command before the rename, runs the same program and says so on stderr.
# legacy-name: name = "agentos" is what a 0.3.0 server node's upgrader looks for in this file: keep this line.
agentos = "openajar.cli:legacy_app"  # legacy-name

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openajar"]

# The sdist PyPI carries: the package and what its wheel is built from, never the rest of the repository
# (tests, the web app's sources, research notes). The web app comes from the release's prebuilt copy
# (`openajar web install`, openajar.setup.webapp), as it does for the installer.
[tool.hatch.build.targets.sdist]
include = [
  "/src/openajar",
  "/deploy/environments",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

# The docker provider's image (Dockerfile, entrypoint) inside the package, so `openajar environments
# setup --build` works from an install without the checkout (openajar.environments.cli._image_source).
[tool.hatch.build.targets.wheel.force-include]
"deploy/environments" = "openajar/environments/image"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "node: needs a Linux node with Camoufox and Xvfb (run with scripts/node-test.sh)",
  "soak: soak and chaos runs on a node, an hour or more (scripts/node-test.sh soak -m soak tests/soak)",
  "network: may reach hosts other than this machine (tests/conftest.py blocks that everywhere else)",
  "ci_smoke: a node test the CI's real-browser job runs (tests/node/ci-smoke.txt lists the rest)",
  "mailserver: runs against a real IMAP and SMTP server in Docker (tests/mail_server), skipped without Docker",
]
addopts = "-m 'not node and not soak'"

[tool.mypy]
# The type check CI runs (`make typecheck`): a clean, blocking baseline on the modules where a wrong
# type is a security bug (config, models, errors and the runtime in core/, the grant tokens and their
# signing keys, the vault's crypto and its Secret) and on the lane manager's interface. Modules they
# import are read for their types (follow_imports = "silent") but not checked. mypy itself is not a
# project dependency: the Makefile and CI run a pinned `uvx mypy`, so uv.lock stays as it is.
#
# TODO, in this order (each one: add it to `files`, fix what mypy reports, keep CI green):
#   src/openajar/policy/wrap.py, service.py, grants.py   the authorization path
#   src/openajar/vault/                                  the rest of the vault
#   src/openajar/mcp/                                    the tool registry and transports
#   src/openajar/node/lanes/, egress/, human.py          the lane manager and its guards
#   src/openajar/api/auth.py, passkeys.py                panel sign-in
#   everything else
python_version = "3.12"
files = [
  "src/openajar/core",
  "src/openajar/policy/tokens.py",
  "src/openajar/policy/keys.py",
  "src/openajar/vault/crypto.py",
  "src/openajar/vault/secret.py",
  "src/openajar/node/interfaces.py",
  "src/openajar/client/call.py",
  "src/openajar/runner/flowfiles.py",
  "src/openajar/runner/flowsync.py",
  "src/openajar/runner/flowtest.py",
  "src/openajar/runner/flowcli.py",
  "src/openajar/node/expose",
  "src/openajar/client/expose.py",
  "src/openajar/git",
]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 110
target-version = "py312"
