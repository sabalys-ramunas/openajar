name: web-release

# The web app, prebuilt for each release, so `openajar web install` (and the web step of `openajar setup`)
# downloads it instead of needing Node.js and pnpm (openajar.setup.webapp). Attached to the release as
# openajar-web-<version>.tar.gz and openajar-web-<version>.tar.gz.sha256: the installer takes both from
# the release of the openajar it runs (v<version>), and trusts only GitHub's own digest of the archive on
# a release GitHub keeps immutable (published once, its files and tag never change).
#
# So it runs by hand for the release's draft, before it is published (`gh workflow run web-release.yml -f
# tag=vX.Y.Z`, docs/DEVELOPING.md "Releases"): GitHub sends no release events for a draft. It never
# replaces a file on a release (no --clobber): to attach again, delete the old asset from the draft first.
# The build is in live mode, since `vite build` refuses the mock, and scripts/web_asset.py checks the
# folder again before packing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and attach the web app to (vX.Y.Z)"
        required: true

permissions:
  contents: read

concurrency:
  group: web-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build and attach the web app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # gh release upload
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Version (the tag's, and it must be the code's)
        id: v
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::$TAG is not a vX.Y.Z tag"; exit 1 ;; esac
          v="${TAG#v}"
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/openajar/__init__.py)
          [ "$v" = "$code" ] || { echo "::error::the tag is $v but src/openajar/__init__.py says $code"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm at the version that wrote web/pnpm-lock.yaml, through corepack (no third-party action).
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: Build (live mode; web/.env.production)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Pack (scripts/web_asset.py, as `make web-asset` runs it)
        run: python3 scripts/web_asset.py --dist web/dist --version "${{ steps.v.outputs.version }}" --out dist-release
      - name: Check the archive unpacks the way openajar web install unpacks it
        run: |
          cd dist-release
          sha256sum -c "openajar-web-${{ steps.v.outputs.version }}.tar.gz.sha256"
          tar tzf "openajar-web-${{ steps.v.outputs.version }}.tar.gz" | grep -qx index.html
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist-release/* --repo "${{ github.repository }}"
