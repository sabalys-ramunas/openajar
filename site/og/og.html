<!doctype html>
<!-- The source of public/og.png (1200 by 630). Render it with site/og/render.py; see site/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>openajar social image</title>
<style>
@font-face { font-family: 'Geist'; font-weight: 100 900; src: url(../public/fonts/geist.woff2) format('woff2'); }
@font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url(../public/fonts/geist-mono.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body {
  position: relative; font-family: 'Geist', sans-serif; color: #fff; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(700px 420px at 900px 560px, rgb(109 74 255 / 0.32), transparent 70%),
    radial-gradient(500px 300px at 120px 640px, rgb(255 170 110 / 0.10), transparent 70%),
    #090b16;
}
.stars { position: absolute; inset: 0; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
.text { position: absolute; left: 68px; top: 60px; width: 500px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
.brand img { width: 44px; height: 44px; }
h1 { margin-top: 70px; font-size: 56px; line-height: 1.0; font-weight: 600; letter-spacing: -0.05em; }
h1 span { display: block; margin-top: 6px; color: #bfaeff; }
p { margin-top: 24px; font-size: 21px; line-height: 1.4; color: rgb(226 229 255 / 0.76); letter-spacing: -0.01em; }
.url { position: absolute; left: 68px; bottom: 52px; font: 500 20px/28px 'Geist Mono', monospace; color: rgb(226 229 255 / 0.7); }
.url b { color: #fff; font-weight: 500; }
.shot { position: absolute; left: 590px; top: 92px; width: 760px; border-radius: 16px; overflow: hidden;
  box-shadow: 0 0 0 1px rgb(255 255 255 / 0.14), 0 40px 90px -30px rgb(0 0 0 / 0.9); }
.shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="text">
    <div class="brand"><img src="../public/icon.svg" alt="">openajar</div>
    <h1>Your AI gets a computer of its own. <span>You watch it work.</span></h1>
    <p>Free and open source. For Claude Code, Codex and any MCP agent.</p>
  </div>
  <div class="url"><b>openajar.com</b></div>
  <div class="shot"><img src="scene.png" alt=""></div>
  <script>
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
    const box = document.getElementById('stars');
    for (let i = 0; i < 46; i++) {
      const s = document.createElement('i');
      s.style.cssText = `left:${rnd() * 100}%;top:${rnd() ** 1.5 * 100}%;opacity:${0.15 + rnd() * 0.5}`;
      box.appendChild(s);
    }
  </script>
</body>
</html>
