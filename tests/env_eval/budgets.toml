# The limits `run.py smoke` holds the product to (docs/EVALS.md, "The smoke checks"). One place, so a
# change to a limit is one line with its reason in the commit.
#
# Static limits are ratchets: a little above what the product is today (2026-11-21, 0.5.0), so growth
# is noticed. Lower one when the product shrinks; raise one only with a reason. They run in CI with the
# unit tests (tests/unit/test_env_eval.py). Merged from the evals/ suite of 2026-11-20.

[static]
errors_without_agent_step = 0        # every error tells the agent what to do next
errors_without_fix = 0               # and tells the person how to fix it
skill_words = 1025                   # the environment skill (1,024 today); test_frontdoor holds it under 1,025 too
tool_description_chars_max = 800     # the longest description among the everyday tools (746 today)
everyday_tools = 30                  # tools in the everyday list (28 today; test_toolsets's budget is 30 with the meta tools)
everyday_description_chars = 10200   # their descriptions together (9,778 today)
everyday_params_undescribed = 0      # their arguments with no description: only shrinks
